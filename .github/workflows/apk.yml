name: Build 3 APKs

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, driver, customer]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx expo prebuild --clean

      - name: Set app variant
        run: |
          if [ "${{ matrix.app }}" = "admin" ]; then echo "APP_VARIANT=admin" >> $GITHUB_ENV; fi
          if [ "${{ matrix.app }}" = "driver" ]; then echo "APP_VARIANT=driver" >> $GITHUB_ENV; fi
          if [ "${{ matrix.app }}" = "customer" ]; then echo "APP_VARIANT=customer" >> $GITHUB_ENV; fi

      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
